version: '3.8'

services:
  vetra-ollama:
    image: ollama/ollama:latest
    container_name: vetra-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped